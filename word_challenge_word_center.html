function render(){let x=data[index];$('count').textContent=`Word ${index+1} of ${data.length}`;$('counter').textContent=`WORD ${index+1}`;$('word').textContent=x.word;$('picture').src=x.img;$('picture').alt=x.word;$('meaning').hidden=true;$('meaning').textContent=x.meaning;$('score').textContent=score;$('bar').style.width=((index+1)/data.length*100)+'%';$('award').textContent=awarded.has(index)?'✓ تم احتساب النقطة':'⭐ +1 نقطة';$('tiles').innerHTML='';data.forEach((v,i)=>{let b=document.createElement('button');b.className='tile'+(i===index?' active':'');b.innerHTML='<span>'+v.emoji+'</span><small>'+v.word+'</small>';b.onclick=()=>{index=i;render()};$('tiles').appendChild(b)})}
$('listen').onclick=()=>speak(data[index].word);$('showMeaning').onclick=()=>{$('meaning').hidden=false;speak(data[index].meaning,'ar-SA')};$('award').onclick=()=>{if(!awarded.has(index)){awarded.add(index);score++;render()}};
$('next').onclick=()=>{index=(index+1)%data.length;render()};$('prev').onclick=()=>{index=(index+data.length-1)%data.length;render()};
$('shuffle').onclick=()=>{for(let i=data.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[data[i],data[j]]=[data[j],data[i]]}index=0;awarded.clear();render()};render();
